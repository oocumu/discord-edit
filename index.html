<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#25262d">
<meta name="description" content="음성 채팅방 화면에 한마디 말풍선을 붙여 이미지로 저장하는 도구">
<meta property="og:title" content="디스코드 에디터">
<meta property="og:description" content="음성 채팅방 화면에 한마디 말풍선을 붙여 이미지로 저장하는 도구">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E">
<title>디스코드 에디터</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous" referrerpolicy="no-referrer" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';document.head.appendChild(s)"></script>
<style>
:root{--sheet:#25262d;--card:#2b2d35;--txt:#f2f3f5;--mute:#9a9ea8;--line:#33353d;--pri:#5865f2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0d0e11;color:var(--txt);font-family:-apple-system,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
.fit{position:relative;flex:none}
.app{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--sheet);overflow:hidden}
.scin{position:absolute;top:0;padding:0 18px 28px;box-sizing:border-box}
.main{display:flex;flex-direction:column}
.sticks{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.stk{position:absolute;pointer-events:auto;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.stk img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.stk.sel{outline:2px dashed var(--pri);outline-offset:3px}
.lbl2{font-size:11px;color:var(--mute);margin:2px 0 6px}
.outsz{font-size:12px;color:var(--mute);margin:0 0 10px}
.bar{padding:14px 0 0}
.ib{width:38px;height:38px;border-radius:50%;background:#3a3c45;display:grid;place-items:center;font-size:15px;border:0;color:var(--txt)}
.lbl{color:var(--mute);font-size:14px;margin:14px 0 8px}
.stream{aspect-ratio:16/9;border-radius:18px;background:linear-gradient(160deg,#e58fc0,#a56bd8);background-size:cover;background-position:center;display:grid;place-items:center}
.join{background:#fff;color:#111;border-radius:24px;padding:12px 22px;font-weight:700;font-size:15px}
.opts{flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:12px;color:var(--mute)}
.opts label{display:flex;align-items:center;gap:5px}
.sm{border:0;border-radius:10px;background:var(--card);color:var(--txt);font:inherit;font-size:13px;padding:7px 11px;cursor:pointer}
.list{margin-top:-22px;padding-top:4px;position:relative;z-index:2}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:0 12px;padding:4px 4px 12px;border-bottom:1px solid var(--line)}
.av{flex:none;position:relative;width:44px;height:44px;border-radius:50%;background-size:cover;background-position:center;display:grid;place-items:center;font-weight:700;font-size:18px;color:#fff}
.edit .av{cursor:pointer}
.nm,.nmw{flex:0 1 auto;min-width:0;max-width:max(32px,calc(100% - 284px));font-weight:600;font-size:16px;overflow:hidden}
.nm{text-overflow:ellipsis;white-space:nowrap}
.nmw{line-height:1.3}
.nmw.grow>.sz{white-space:pre;word-break:normal}
.nmw>input{width:0!important;min-width:100%!important;text-overflow:ellipsis;white-space:nowrap}
.app.exp-mode .nm,.app.exp-mode .nmw{max-width:calc(100% - 60px)}
.app.exp-mode .nmw>input{text-overflow:clip}
.grow{display:inline-grid;vertical-align:top}
.grow>.sz{grid-area:1/1;visibility:hidden;white-space:pre-wrap;word-break:break-word;font:inherit;line-height:inherit;min-height:1.3em;overflow:hidden}
.grow>input,.grow>textarea{grid-area:1/1;font:inherit;line-height:inherit;color:inherit;background:none;border:0;outline:0;padding:0;margin:0;width:100%;min-width:0;resize:none;overflow:hidden}
.bw{flex:0 0 100%;display:flex;margin:0 0 18px}
.bub{position:relative;background:#fff;color:#111;border-radius:20px;padding:9px 16px;margin-left:4px;max-width:calc(100% - 4px);box-shadow:0 3px 0 #0003,0 7px 12px #0006;font-size:14px;line-height:1.35;word-break:break-word;white-space:pre-wrap}
.bub textarea::placeholder{color:#999}
/* 아바타 + 닉네임은 가운데, 버튼은 오른쪽 끝에 고정 */
.row{position:relative;justify-content:center}
.ctl{position:absolute;right:4px;margin-left:0}
.list>.row:first-child .ctl{bottom:20px}
.list>.row:not(:first-child) .ctl{top:12px}
/* 두 번째 이후: 말풍선을 아바타·닉네임 줄 아래로, 꼬리는 위쪽(프로필 방향) */
.list>.row:not(:first-child) .bw{order:5}
.bub.sel{outline:2px dashed var(--pri);outline-offset:4px}
.tune{display:grid;grid-template-columns:auto 1fr 38px;gap:6px 10px;align-items:center;font-size:12px;color:var(--mute);}
.tune[hidden]{display:none}
.tune.idle input[type=range],.tune.idle .tg{opacity:.35;pointer-events:none}
.tune.idle #t_name{color:var(--mute);font-weight:500}
/* 왼쪽 패널 + 오른쪽 에디터 */
.shell{display:grid;grid-template-columns:minmax(300px,360px) 1fr;height:100%}
.panel{min-height:0;overflow-y:auto;background:#17181c;border-right:1px solid #26272d;padding:16px 14px 28px;display:flex;flex-direction:column;gap:12px}
.panel h1{margin:2px 2px 0;font-size:16px}
.sec{background:#1f2026;border-radius:14px;padding:12px}
.sec h2{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--mute)}
.panel .opts{gap:8px}
.panel .chips{margin-bottom:10px}
#save{width:100%}
.stage{min-width:0;min-height:0;display:flex;justify-content:center;align-items:center;padding:20px;overflow:hidden;background:#000}
@media (max-width:860px){
  html,body{height:auto}
  .shell{display:flex;flex-direction:column;height:auto}
  .stage{order:-1;position:sticky;top:0;z-index:5;padding:8px 0;height:min(58vh,540px)}
  .panel{overflow:visible;border-right:0}
}
.tune .hd2{grid-column:1/-1;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tune .hd2 b{color:var(--txt);font-size:13px;margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45%}
.tune input[type=range]{width:100%;min-width:0;accent-color:var(--pri);margin:0}
.tune output{text-align:right;color:var(--txt);font-variant-numeric:tabular-nums}
.bub{touch-action:none;cursor:grab}
.bub.dragging{cursor:grabbing;box-shadow:0 5px 0 #0003,0 14px 22px #0008}
body.dragging,body.dragging *{user-select:none;-webkit-user-select:none;cursor:grabbing!important}
.btail{position:absolute;left:8px;top:calc(100% - 3px);width:28px;height:18px;overflow:visible}
.notail .btail{display:none}
.tm{display:none;grid-area:1/1;color:#555;font-size:14px;line-height:1.35}
.tm b{color:#111;font-weight:700}
.bub.typ .tm{display:block}
.bub.typ .bt,.bub.typ textarea{display:none}
.bub.typ.grow>.sz{display:none}
.ctl{display:flex;gap:4px;flex:none;margin-left:auto}
.tg{flex:none;border:0;border-radius:10px;background:var(--card);color:var(--mute);font:inherit;font-size:11px;padding:6px 7px;cursor:pointer;white-space:nowrap}
.tg.on{background:var(--pri);color:#fff}
.chips{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.chips button{border:0;border-radius:12px;background:#2b2b2b;color:var(--mute);font:inherit;font-size:13px;font-weight:600;padding:8px 11px;cursor:pointer}
.chips button.on{background:#fff;color:#111}
#save{border:0;border-radius:14px;background:var(--pri);color:#fff;font:inherit;font-weight:700;padding:10px 16px;cursor:pointer}
#save:disabled{opacity:.6}
#msg{width:100%;font-size:12px;color:var(--mute);text-align:center}
</style>
</head>
<body>
<div class="shell">
<aside class="panel" id="panel">
  <h1>디스코드 에디터</h1>
  <section class="sec">
    <h2>인원 · 말풍선</h2>
    <div class="opts">
      <button class="sm" id="addp">＋ 인원 추가</button>
      <button class="sm" id="addb">＋ 말풍선 추가</button>
      <button class="sm" id="resetpos">말풍선 위치 초기화</button>
    </div>
  </section>
    <section class="sec tune idle no-export" id="tune">
  <div class="hd2"><b id="t_name"></b><button class="tg" id="t_tail">꼬리</button><button class="tg" id="t_dn">꼬리 아래</button><button class="tg" id="t_up">꼬리 위</button><button class="tg" id="t_del">말풍선 삭제</button><button class="tg" id="t_reset">초기화</button><button class="tg" id="t_close">선택 해제</button></div>
    <span>기울기</span><input type="range" id="t_rot" min="-30" max="30" step="0.5"><output id="o_rot"></output>
    <span>꼬리 위치</span><input type="range" id="t_tx" min="0" max="100" step="1"><output id="o_tx"></output>
    <span>꼬리 크기</span><input type="range" id="t_ts" min="0.4" max="2" step="0.05"><output id="o_ts"></output>
    <span>꼬리 휘어짐</span><input type="range" id="t_tk" min="-45" max="45" step="1"><output id="o_tk"></output>
  </section>
  <section class="sec">
    <h2>스티커</h2>
    <div class="opts">
      <button class="sm" id="addstk">🖼 스티커 추가 (이미지)</button>
      <input type="file" id="stkfile" accept="image/*" multiple hidden>
    </div>
    <div class="tune idle no-export" id="stkctl" style="margin-top:10px">
      <div class="hd2"><b id="s_name"></b><button class="tg" id="s_flip">좌우 반전</button><button class="tg" id="s_front">맨 앞으로</button><button class="tg" id="s_dup">복제</button><button class="tg" id="s_del">삭제</button></div>
      <span>크기</span><input type="range" id="s_w" min="5" max="100" step="1"><output id="so_w"></output>
      <span>기울기</span><input type="range" id="s_rot" min="-180" max="180" step="1"><output id="so_rot"></output>
      <span>투명도</span><input type="range" id="s_op" min="20" max="100" step="1"><output id="so_op"></output>
    </div>
  </section>
  <section class="sec">
    <h2>방송 화면 이미지</h2>
    <div class="opts">
      <button class="sm" id="pick">🖼 이미지 넣기</button>
      <button class="sm" id="clear" style="display:none">지우기</button>
      <label><input type="checkbox" id="blurchk"> 흐리게</label>
      <input type="file" id="file" accept="image/*" hidden>
    </div>
  </section>
  <section class="sec">
    <h2>PNG 저장</h2>
    <div class="lbl2">화면 비율 (미리보기 화면도 함께 바뀌어요)</div>
    <div class="chips" id="chips">
      <button data-r="orig" class="on">원본</button><button data-r="1:1">1:1</button><button data-r="3:4">3:4</button><button data-r="4:5">4:5</button><button data-r="9:16">9:16</button><button data-r="16:9">16:9</button>
    </div>
    <div class="lbl2">출력 크기</div>
    <div class="chips" id="schips">
      <button data-s="1">1배</button><button data-s="2" class="on">2배</button><button data-s="3">3배</button><button data-s="4">4배</button>
    </div>
    <div class="outsz" id="outsz"></div>
    <button id="save">PNG 저장</button>
    <div id="msg"></div>
  </section>
</aside>
<main class="stage" id="stage">
<div class="fit" id="fit"><div class="app" id="app">
  <div class="scin" id="scin">
    <div class="main">
      <div class="bar"><button class="ib">⌄</button></div>
      <div class="lbl">방송 중이에요…</div>
      <div class="stream" id="stream"><div class="join">방송 보기</div></div>
    </div>
    <div class="list" id="list"></div>
  </div>
  <div class="sticks" id="sticks"></div>
</div></div>
</main>
</div>
<script>
const $=id=>document.getElementById(id);
const rt=window.claude&&typeof window.claude.use==='function'?window.claude:null;   // Claude 안에서만 존재 (GitHub Pages에서는 null)
const colors=['#3b82f6','#eb459e','#f0b132','#23a55a','#ed4245','#8b5cf6'];
const color=s=>colors[[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%colors.length];
const idOf=n=>'u_'+[...n].map(c=>c.charCodeAt(0).toString(36)).join('_');
const RATIOS={orig:null,'1:1':1,'3:4':3/4,'4:5':4/5,'9:16':9/16,'16:9':16/9};
let outScale=2,vs=1;   // vs: 화면에 맞추려고 미리보기를 줄인 배율
const CW=400;          // 내용(방송 화면+목록)의 고정 너비
const TAIL='<img class="btail" alt="" draggable="false">';
const TPL='{닉네임} 님이 입력중...';
function setSys(el,name){el.textContent='';TPL.split('{닉네임}').forEach((p,i)=>{if(i){const b=document.createElement('b');b.textContent=name;el.appendChild(b)}el.appendChild(document.createTextNode(p))})}
let users=[],col=null,dl=null,ratio='orig';
const hid=new Set(),typ=new Set();
let me={name:'',text:'',avatar:'',joined:0};
try{Object.assign(me,JSON.parse(localStorage.getItem('hm_me')||'{}'))}catch(e){}
let guests=[];try{guests=JSON.parse(localStorage.getItem('hm_guests')||'[]')}catch(e){}
const meActive=()=>!!(me.name||me.text||me.avatar);
const meName=()=>me.name||'익명';
let lastId=meActive()?idOf(meName()):null;

function setAv(el,name,avatar){
  el.style.backgroundImage=avatar?'url("'+avatar+'")':'';
  el.style.backgroundColor=avatar?'':color(name);
  el.querySelector('.ini').textContent=avatar?'':[...name][0];
}
function cropAvatar(f,cb){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const s=96,c=document.createElement('canvas');c.width=c.height=s;
    const m=Math.min(im.naturalWidth,im.naturalHeight),sx=(im.naturalWidth-m)/2,sy=(im.naturalHeight-m)/2;
    c.getContext('2d').drawImage(im,sx,sy,m,m,0,0,s,s);
    cb(c.toDataURL('image/jpeg',.82));
  };im.src=r.result};
  r.readAsDataURL(f);
}

function setV(el,v){el.dataset.v=v;const z=el.querySelector(':scope>.sz');if(z)z.textContent=v+' '}
/* 직접 편집 가능한 행 (나 / 추가한 인원) */
function editRow(p,key,onsave,onDel){
  const r=document.createElement('div');r.className='row edit';r._key=key;r._p=p;
  r.innerHTML='<div class="bw"><div class="bub grow" data-v="">'+TAIL+'<textarea rows="1" maxlength="60" placeholder="한마디…"></textarea><span class="tm"></span><span class="sz"></span></div></div>'+
   '<div class="av"><span class="ini"></span></div>'+
   '<div class="nmw grow" data-v=""><input maxlength="10" placeholder="닉네임"><span class="sz"></span></div>'+
   '<div class="ctl no-export"><button class="tg ty">입력중</button><button class="tg hd"></button>'+(onDel?'<button class="tg dl" title="삭제">✕</button>':'')+'</div>';
  const q=s=>r.querySelector(s);
  const nmw=q('.nmw'),nm=nmw.querySelector('input'),bub=q('.bub'),tx=bub.querySelector('textarea'),av=q('.av');
  nm.value=p.name;setV(nmw,p.name||'닉네임');tx.value=p.text;setV(bub,p.text||'한마디…');
  nm.oninput=()=>{p.name=nm.value.trim();setV(nmw,nm.value||'닉네임');onsave();render()};
  tx.oninput=()=>{p.text=tx.value;setV(bub,tx.value||'한마디…');onsave();render()};
  tx.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();tx.blur()}});
  nm.addEventListener('blur',()=>onsave(true));
  tx.addEventListener('blur',()=>onsave(true));
  const f=document.createElement('input');f.type='file';f.accept='image/*';f.hidden=true;r.appendChild(f);
  av.onclick=()=>f.click();
  f.onchange=e=>{const file=e.target.files[0];if(file)cropAvatar(file,d=>{p.avatar=d;onsave(true);render()});e.target.value=''};
  q('.ty').onclick=()=>{typ.has(key)?typ.delete(key):typ.add(key);render()};
  q('.hd').onclick=()=>{hid.has(key)?hid.delete(key):hid.add(key);render()};
  if(onDel)q('.dl').onclick=onDel;
  r._sync=()=>{
    const name=p.name||'익명';
    setAv(av,name,p.avatar);
    bub.classList.toggle('typ',typ.has(key));
    bub.classList.toggle('empty',!p.text&&!typ.has(key));
    setSys(bub.querySelector('.tm'),name);
    q('.bw').style.display=(hid.has(key)||p.nb)?'none':'';
    q('.ty').classList.toggle('on',typ.has(key));
    q('.hd').textContent=hid.has(key)?'켜기':'끄기';
  };
  return r;
}

/* 내 행 (다른 사람에게 공유) */
let tm;
function persist(){try{localStorage.setItem('hm_me',JSON.stringify(me))}catch(e){}}
async function save(){
  persist();
  if(!meActive()||!col)return;
  if(!me.joined){me.joined=Date.now();persist()}
  const u={name:meName(),text:me.text,avatar:me.avatar,joined:me.joined,ts:Date.now()};
  try{
    const id=idOf(u.name);
    if(lastId&&lastId!==id)await col.doc(lastId).delete();
    lastId=id;
    await col.doc(id).set(u);
  }catch(e){}
}
const meRow=editRow(me,'me',imm=>{persist();if(imm){clearTimeout(tm);save()}else{clearTimeout(tm);tm=setTimeout(save,500)}});

/* 추가한 인원 (내 화면에만) */
const gRows=[];
function saveGuests(){try{localStorage.setItem('hm_guests',JSON.stringify(guests))}catch(e){}}
function addGuestRow(g){
  const key='g_'+g.id;
  const r=editRow(g,key,saveGuests,()=>{
    guests=guests.filter(x=>x!==g);gRows.splice(gRows.indexOf(r),1);r.remove();
    hid.delete(key);typ.delete(key);saveGuests();render();
  });
  gRows.push(r);return r;
}
guests.forEach(addGuestRow);
$('addp').onclick=()=>{
  const g={id:Date.now().toString(36),name:'',text:'',avatar:'',nb:true};
  guests.push(g);addGuestRow(g);saveGuests();render();   // 스크롤·포커스 이동 없이 그 자리에서 추가
};

/* 말풍선 추가: 말풍선이 없는 사람에게 붙이고, 모두 있으면 새 사람+말풍선 */
$('addb').onclick=()=>{
  const list=[meRow].concat(gRows);
  const selR=typeof selKey!=='undefined'&&selKey?list.find(r=>r._key===selKey):null;
  let target=(selR&&selR._p.nb)?selR:list.find(r=>r._p.nb);
  if(target){
    target._p.nb=false;hid.delete(target._key);
    if(target===meRow)persist();else saveGuests();
  }else{
    const g={id:Date.now().toString(36),name:'',text:'',avatar:'',nb:false};
    guests.push(g);target=addGuestRow(g);saveGuests();
  }
  render();place();
  select(target._key);   // 스크롤 이동 없이 패널만 선택 상태로
};

/* 다른 접속자 행 */
const rows=new Map();
function makeOther(id){
  const r=document.createElement('div');r.className='row';r._key=id;
  r.innerHTML='<div class="bw"><div class="bub">'+TAIL+'<span class="bt"></span><span class="tm"></span></div></div><div class="av"><span class="ini"></span></div><div class="nm"></div><div class="ctl no-export"><button class="tg ty">입력중</button><button class="tg hd"></button></div>';
  r.querySelector('.ty').onclick=()=>{typ.has(id)?typ.delete(id):typ.add(id);render()};
  r.querySelector('.hd').onclick=()=>{hid.has(id)?hid.delete(id):hid.add(id);render()};
  return r;
}
function updateOther(r,u,id){

function drawTail(t,tl,ts,tk,down){
  const sh=Math.tan(tk*Math.PI/180),sy=down?ts:-ts,K=28/36;
  const f=([x,y])=>[18+ts*(x-18+sh*y),sy*y];
  const P=[[0,0],[36,0],[27,1],[24,7],[21,14],[18,21],[15,14],[12,7],[9,1],[0,0]].map(f);
  const xs=P.map(q=>q[0]),ys=P.map(q=>q[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const n=v=>Math.round(v*100)/100,pt=q=>n(q[0])+' '+n(q[1]);
  const vw=n(Math.max(.1,x1-x0)),vh=n(Math.max(.1,y1-y0));
  const d='M'+pt(P[0])+' L'+pt(P[1])+' C'+pt(P[2])+' '+pt(P[3])+' '+pt(P[4])+' Q'+pt(P[5])+' '+pt(P[6])+' C'+pt(P[7])+' '+pt(P[8])+' '+pt(P[9])+' Z';
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+n(vw*K)+'" height="'+n(vh*K)+'" viewBox="'+n(x0)+' '+n(y0)+' '+vw+' '+vh+'"><path d="'+d+'" fill="#fff"/></svg>';
  if(t._svg!==svg){t._svg=svg;t.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
  t.style.width=n((x1-x0)*K)+'px';t.style.height=n((y1-y0)*K)+'px';
  t.style.left=n(tl+14+(x0-18)*K)+'px';
  t.style.transform='none';
  t.style.top=down?'calc(100% - 3px + '+n(y0*K)+'px)':n(3+y0*K)+'px';
}

    const autoRot=0,dx=[12,-4,18,6,-8,14][(seed>>1)%6];

let img=null,blurUrl=null;
function blurPass(a,b,w,h,r,horiz){
  const len=horiz?w:h,lines=horiz?h:w,stride=horiz?4:4*w,ls=horiz?4*w:4,div=2*r+1;
  for(let l=0;l<lines;l++){
    const base=l*ls;
    for(let ch=0;ch<3;ch++){
      let sum=0;
      for(let k=-r;k<=r;k++)sum+=a[base+Math.min(len-1,Math.max(0,k))*stride+ch];
      for(let i=0;i<len;i++){
        b[base+i*stride+ch]=sum/div;
        sum+=a[base+Math.min(len-1,i+r+1)*stride+ch]-a[base+Math.max(0,i-r)*stride+ch];
      }
    }
  }
}
function makeBlur(im){
  const sc=Math.min(1,720/im.naturalWidth);
  const w=Math.max(2,Math.round(im.naturalWidth*sc)),h=Math.max(2,Math.round(im.naturalHeight*sc));
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(im,0,0,w,h);
  const id=x.getImageData(0,0,w,h),n=w*h*4;
  let A=new Float32Array(n),B=new Float32Array(n);
  for(let i=0;i<n;i++)A[i]=id.data[i];
  const r=Math.max(2,Math.round(Math.min(w,h)*.05));
  for(let k=0;k<3;k++){blurPass(A,B,w,h,r,true);blurPass(B,A,w,h,r,false)}   // 가로·세로 3회씩
  for(let i=0;i<n;i+=4){id.data[i]=A[i];id.data[i+1]=A[i+1];id.data[i+2]=A[i+2];id.data[i+3]=255}
  x.putImageData(id,0,0);
  return c.toDataURL('image/jpeg',.94);
}

  if(!img){st.style.backgroundImage='';return}

  st.style.backgroundImage='url("'+url+'")';

  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{img=im;blurUrl=null;applyBg()};im.src=r.result};
  r.readAsDataURL(f);e.target.value='';
};
$('clear').onclick=()=>{img=null;blurUrl=null;applyBg()};
$('blurchk').onchange=applyBg;

/* PNG 저장 */
$('chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;ratio=b.dataset.r;[...$('chips').children].forEach(x=>x.classList.toggle('on',x===b));relayout()};
$('schips').onclick=e=>{const b=e.target.closest('button');if(!b)return;outScale=+b.dataset.s;[...$('schips').children].forEach(x=>x.classList.toggle('on',x===b));updateOut()};
async function saveBlob(blob,filename){
  if(dl){
    try{await dl.save({filename,data:blob});return}
    catch(e){if(e&&e.code==='declined')throw e}
  }
  const file=new File([blob],filename,{type:'image/png'});
  const ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:filename});return}
    catch(e){if(e&&e.name==='AbortError'){const er=new Error('declined');er.code='declined';throw er}}
  }
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),15000);
}
$('save').onclick=async()=>{
  const msg=$('msg'),btn=$('save');
  if(!window.html2canvas){msg.textContent='이미지 변환 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요';return}
  btn.disabled=true;msg.textContent='이미지 만드는 중…';
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const canvas=await html2canvas($('app'),{scale:outScale,backgroundColor:'#25262d',useCORS:true,logging:false,onclone:doc=>{
      // 패널을 뺀 뒤 미리보기 화면만 왼쪽 위에 두고, 화면과 같은 크기·같은 스크롤 위치로 그린다
      const pn=doc.getElementById('panel'),sh=doc.querySelector('.shell'),sg=doc.getElementById('stage'),bx=doc.getElementById('fit');
      if(pn)pn.remove();
      if(sh){sh.style.display='block';sh.style.height='auto'}
      if(sg){sg.style.cssText='padding:0;display:block;height:auto;position:static;background:transparent;overflow:visible'}
      doc.documentElement.style.height='auto';doc.body.style.height='auto';
      const a=doc.getElementById('app');a.classList.add('exp-mode');
      a.style.transform='none';a.style.position='relative';   // 화면 맞춤용 축소 해제 → 실제 크기로 저장
      if(bx){bx.style.cssText='position:static;width:auto;height:auto'}
      doc.querySelectorAll('.no-export').forEach(x=>x.remove());
      doc.querySelectorAll('.bub.empty').forEach(x=>{const w=x.closest('.bw');if(w)w.style.display='none';else x.remove()});
      doc.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));
      doc.querySelectorAll('.nmw input').forEach(i=>{if(!i.value.trim())i.value='익명'});
      padFirst(doc);
      fit(doc);
    }});
    const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
    if(!blob)throw new Error('empty');
    await saveBlob(blob,'hanmadi-'+(ratio==='orig'?'original':ratio.replace(':','x'))+'-'+outScale+'x.png');
    msg.textContent='';
  }catch(e){
    msg.textContent=e&&e.code==='declined'?'저장을 취소했어요':'저장에 실패했어요. 다시 시도해 주세요';
    if(!(e&&e.code==='declined'))console.error(e);
  }
  finally{btn.disabled=false}
};
</script>
